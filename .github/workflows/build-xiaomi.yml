name: Build Xiaomi Debloater Scanner

on:
  push:
    branches: [main]
    paths:
      - 'xiaomi-debloater/**'
      - '.github/workflows/build-xiaomi.yml'
  pull_request:
    paths:
      - 'xiaomi-debloater/**'
      - '.github/workflows/build-xiaomi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: xiaomi-debloater
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes e APK de diagnostico
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Guardar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-Debloater-Scanner-Debug
          path: xiaomi-debloater/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
